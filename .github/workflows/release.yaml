name: Build and Release

on:
  push:
    tags:
      - 'v*' 

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/firedrop-client/package-lock.json' 

      - name: Build Frontend
        working-directory: ./client/firedrop-client
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: 'server/go.sum'

      - name: Build Multi-Platform Binaries
        working-directory: ./server
        run: |
          mkdir -p release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o release/Firedrop-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o release/Firedrop-linux-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o release/Firedrop-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o release/Firedrop-darwin-arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o release/Firedrop-darwin-amd64 .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: server/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}